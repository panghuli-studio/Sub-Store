# Builds our own Sub-Store image from `dev` and publishes it to
# ghcr.io/panghuli-studio/sub-store. Deployments pin the image by digest, so the release
# notes must carry the digest.
name: panghuli release

on:
  push:
    branches: [dev]
    paths-ignore:
      - "**.md"
      - ".github/ISSUE_TEMPLATE/**"
      - ".github/workflows/panghuli-upstream-watch.yml"
      - ".github/workflows/main.yml"
      - ".github/workflows/star-history.yml"
  # Monthly rebuild so the baked DB-IP City Lite (published at the start of each month)
  # stays current; it releases <upstream>-panghuli.N+1 even when dev did not change.
  schedule:
    - cron: "17 3 3 * *"
  workflow_dispatch:

permissions:
  contents: write
  packages: write

concurrency:
  group: panghuli-release
  cancel-in-progress: false

env:
  IMAGE: ghcr.io/${{ github.repository_owner }}/sub-store

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # Tag = upstream version from backend/package.json + "-panghuli.N"; N restarts at 1
      # for each upstream version. Upstream tags have no "v" prefix, so neither do ours.
      - id: tag
        run: |
          base=$(node -p "require('./backend/package.json').version")
          last=$(git tag -l "${base}-panghuli.*" | sed 's/.*-panghuli\.//' | sort -n | tail -1)
          echo "tag=${base}-panghuli.$(( ${last:-0} + 1 ))" >> "$GITHUB_OUTPUT"
          echo "previous=$(git tag -l '*-panghuli.*' --sort=-creatordate | head -1)" >> "$GITHUB_OUTPUT"
          # The image runs the same Node version the bundle was tested with.
          echo "node=$(tr -d ' \r\n' < .node-version)" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-node@v4
        with:
          node-version-file: ".node-version"

      - name: Test and bundle
        working-directory: backend
        run: |
          corepack enable
          pnpm install --frozen-lockfile
          pnpm test
          pnpm bundle:esbuild
          test -s dist/sub-store.bundle.js

      - uses: pnpm/action-setup@v4
        with:
          version: 11.0.9
      - name: Build approved front-end
        run: .github/panghuli/build-frontend.sh

      - name: Prepare release attachments
        run: |
          node --test .github/panghuli/release-assets.test.mjs
          sh .github/panghuli/prepare-release-assets.sh

      - name: Fetch DB-IP City Lite
        run: .github/panghuli/fetch-dbip.sh >> "$GITHUB_ENV"

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: .github/panghuli/Dockerfile
          platforms: linux/amd64,linux/arm64
          build-args: NODE_VERSION=${{ steps.tag.outputs.node }}
          push: true
          tags: ${{ env.IMAGE }}:${{ steps.tag.outputs.tag }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ steps.tag.outputs.tag }}
            studio.panghuli.dbip.version=${{ env.DBIP_VERSION }}
            studio.panghuli.dbip.path=/opt/app/geo/dbip-city-lite.mmdb
            studio.panghuli.dbip.attribution=IP Geolocation by DB-IP (https://db-ip.com), CC BY 4.0

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.tag.outputs.tag }}
          PREVIOUS: ${{ steps.tag.outputs.previous }}
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          {
            echo "Built from \`dev\` at ${GITHUB_SHA}."
            echo
            echo "Image: \`${IMAGE}:${TAG}\`"
            echo
            echo "Digest: \`${IMAGE}@${DIGEST}\`"
            echo
            echo "Front-end: custom UI based on sub-store-org/Sub-Store-Front-End ${FRONTEND_VERSION}; bundled in frontend.zip."
            echo
            echo "Geo database: DB-IP IP to City Lite ${DBIP_VERSION} at \`/opt/app/geo/dbip-city-lite.mmdb\`."
            echo "IP Geolocation by DB-IP (https://db-ip.com), licensed under CC BY 4.0."
            echo
            if [ -n "$PREVIOUS" ]; then
              echo "Changes since ${PREVIOUS}:"
              echo
              git log --no-merges --format='- %s (%h)' "${PREVIOUS}..${GITHUB_SHA}" | head -100
            fi
          } > notes.md
          gh release create "$TAG" sub-store.bundle.js frontend.zip checksums.txt \
            --target "$GITHUB_SHA" --title "$TAG" --notes-file notes.md
